<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">SO Engine — от списка до отчёта</title>
  <desc id="desc">Четыре шага: список предметов, публичный стакан Steam, локальный расчёт и файлы результатов. Программа не размещает заявки.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#17283f"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#8daac3"/></marker>
  </defs>
  <rect width="960" height="460" rx="24" fill="url(#bg)"/>
  <path d="M40 31h85" stroke="#58dec2" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="40" y="75" fill="#f4f7fb" font-size="30" font-weight="700">ОТ СПИСКА ПРЕДМЕТОВ К ОТЧЁТУ</text>
    <text x="40" y="108" fill="#c4d2e2" font-size="20">Программа анализирует рынок, но не размещает заявки.</text>
    <rect x="40" y="142" width="400" height="110" rx="16" fill="#203149" stroke="#536d88"/>
    <text x="62" y="177" fill="#76f1d6" font-size="18" font-weight="700">01  /  ВХОД</text>
    <text x="62" y="218" fill="#fff" font-size="26">Список предметов CS2</text>
    <path d="M452 197h50" stroke="#8daac3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="520" y="142" width="400" height="110" rx="16" fill="#203149" stroke="#536d88"/>
    <text x="542" y="177" fill="#76f1d6" font-size="18" font-weight="700">02  /  ДАННЫЕ STEAM</text>
    <text x="542" y="218" fill="#fff" font-size="26">Публичный стакан</text>
    <path d="M720 262v27" stroke="#8daac3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="520" y="304" width="400" height="110" rx="16" fill="#203149" stroke="#536d88"/>
    <text x="542" y="339" fill="#76f1d6" font-size="18" font-weight="700">03  /  РАСЧЁТ</text>
    <text x="542" y="380" fill="#fff" font-size="26">Цена по правилам проекта</text>
    <path d="M508 359h-50" stroke="#8daac3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="304" width="400" height="110" rx="16" fill="#203149" stroke="#58dec2"/>
    <text x="62" y="339" fill="#76f1d6" font-size="18" font-weight="700">04  /  ПРОВЕРКА</text>
    <text x="62" y="380" fill="#fff" font-size="26">Результат и аудит</text>
  </g>
</svg>